apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      containers:
        - name: ${APPLICATION_NAME}
          image: eribyteofficial/eriauth
          imagePullPolicy: Always
          ports:
            - containerPort: 46469
          env:
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: APP_ID
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: APP_ID
            - name: CRUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: CRUD_PASSWORD
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: APP_SECRET
          
            - name: ENCRYPTION_URL
              valueFrom:
                configMapKeyRef:
                  name: ${CONFIG_NAME}
                  key: ENCRYPTION_URL
            - name: CRUD_URL
              valueFrom:
                configMapKeyRef:
                  name: ${CONFIG_NAME}
                  key: CRUD_URL

  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
spec:
  type: ClusterIP
  clusterIP: ${ip}
  selector:
    app: ${APPLICATION_NAME}
  externalIPs:
    - ${external-ip}
  ports:
    - targetPort: 46469
      port: 46469
